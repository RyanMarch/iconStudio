<!DOCTYPE html>
<html lang="en" translate="no">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="{{FAVICON_DIR}}/favicon-96x96.png?v=2" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="{{FAVICON_DIR}}/favicon.svg?v=2" />
    <link rel="shortcut icon" href="{{FAVICON_DIR}}/favicon.ico?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="{{FAVICON_DIR}}/apple-touch-icon.png?v=2" />
    <meta name="apple-mobile-web-app-title" content="{{PROJECT_NAME}}" />
    <link rel="manifest" href="{{FAVICON_DIR}}/site.webmanifest?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="google" content="notranslate">
    <script>
        // Theme initialization to prevent flicker
        (function () {
            const savedTheme = localStorage.getItem('theme') || 'light';
            if (savedTheme === 'system') {
                const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme-mode', 'system');
            } else {
                document.documentElement.setAttribute('data-theme', savedTheme);
                document.documentElement.removeAttribute('data-theme-mode');
            }
        })();
    </script>

    {{FONTS_LOAD_LINK}}

    <title>User Guide — {{PROJECT_NAME}}</title>
    <meta name="description" content="Learn how to use {{PROJECT_NAME}} with helpful guides explaining what's available.">
    <link rel="canonical" href="{{BASE_URL}}/support/">

    <!-- Docs Style Sheet -->
    <link rel="stylesheet" href="style.css">
    <script src="docs-components.js" type="module"></script>
</head>

<body class="user-docs-page docs-home-page">
    <docs-header></docs-header>
    <div class="app-container">
        <!-- Mobile Navigation Overlay -->
        <div id="mobile-overlay" class="mobile-overlay"></div>

        <main class="page-container-fullwidth user-docs">
            <!-- Sidebar Navigation (visible only on mobile) -->
            <docs-sidebar></docs-sidebar>

            <!-- Right-side Content & Header Wrapper -->
            <div class="page-content-wrapper">

                <!-- Content Area -->
                <docs-anchor-helper>
                    <div class="docs-hero">
                        <h1>Help Center</h1>
                        <p class="lead">Search guides, explore features, and learn how to use {{PROJECT_NAME}}.</p>
                        <docs-search></docs-search>
                    </div>

                    <h2 class="docs-categories-title">Explore Guides</h2>

                    <docs-grid></docs-grid>

                </docs-anchor-helper>
            </div>
        </main>

        <!-- Footer -->
        <docs-footer></docs-footer>

        <!-- Lightbox Modal -->
        <div id="lightbox-modal" class="lightbox-modal" aria-hidden="true" role="dialog" aria-label="Image Viewer">
            <button class="lightbox-close" aria-label="Close image viewer">&times;</button>
            <img class="lightbox-content" id="lightbox-img" alt="">
            <div class="lightbox-caption" id="lightbox-caption"></div>
        </div>
    </div>
</body>

</html>
