<!DOCTYPE html>
<html lang="en" translate="no" data-theme-style="tech">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/assets/favicon/favicon-96x96.png?v=2" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg?v=2" />
    <link rel="shortcut icon" href="/assets/favicon/favicon.ico?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png?v=2" />
    <meta name="apple-mobile-web-app-title" content="Icon Studio" />
    <link rel="manifest" href="/assets/favicon/site.webmanifest?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="google" content="notranslate">
    <script>
        // Theme initialization to prevent flicker
        (function () {
            const savedTheme = localStorage.getItem('theme') || 'light';
            if (savedTheme === 'system') {
                const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme-mode', 'system');
            } else {
                document.documentElement.setAttribute('data-theme', savedTheme);
                document.documentElement.removeAttribute('data-theme-mode');
            }
        })();
    </script>

    <!-- Preconnect Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">

    <!-- Global Style (Relative back up to root) -->
    <link rel="stylesheet" href="../style.css">

    <title>User Guide — Icon Studio</title>
    <meta name="description" content="Learn how to use Icon Studio with helpful guides explaining what's available.">
    <link rel="canonical" href="https://iconstudio.ryanmarch.me/docs/">

    <!-- Docs Style Sheet -->
    <link rel="stylesheet" href="style.css">
    <script src="docs-components.js" type="module"></script>
</head>

<body class="user-docs-page docs-home-page">
    <div class="docs-app-viewport">
        <!-- Mobile Navigation Overlay -->
        <div id="mobile-overlay" class="mobile-overlay"></div>

        <main class="docs-layout-container">
            <!-- Content & Header Wrapper -->
            <div class="docs-content-column">
                <docs-header nav-src="/docs/nav.json"></docs-header>

                <!-- Content Area -->
                <docs-anchor-helper>
                    <div class="docs-hero">
                        <h1>Help Center</h1>
                        <p class="lead">Search guides, explore features, and learn how to use
                            Icon Studio.</p>
                        <div class="docs-hero-search-card">
                            <docs-search placeholder="Search guides…"></docs-search>
                            <span class="search-hint" aria-hidden="true">Press <kbd>/</kbd></span>
                        </div>
                    </div>

                    <h2 class="docs-categories-title">Explore Guides</h2>

                    <docs-grid></docs-grid>

                </docs-anchor-helper>
            </div>
        </main>

        <!-- Footer -->
        <icon-studio-footer></icon-studio-footer>

        <!-- Lightbox Modal -->
        <div id="lightbox-modal" class="lightbox-modal" aria-hidden="true" role="dialog" aria-label="Image Viewer">
            <button class="lightbox-close" aria-label="Close image viewer">&times;</button>
            <img class="lightbox-content" id="lightbox-img" alt="">
            <div class="lightbox-caption" id="lightbox-caption"></div>
        </div>
    </div>
</body>

</html>
